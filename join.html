<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join as Member | International Organisation of Peace</title>
    <style>
        body { 
            font-family: 'Times New Roman', Georgia, serif; 
            background-color: #0b1a30; 
            margin: 0; 
            padding: 0; 
            color: #ffffff; 
        }
        .header { 
            text-align: center; 
            padding: 25px 15px; 
            background-color: #071120; 
            border-bottom: 4px solid #d4af37; 
        }
        .header img {
            width: 100%;
            max-width: 180px;
            height: auto;
            border-radius: 4px;
        }
        .container { 
            max-width: 480px; 
            margin: 30px auto; 
            background-color: #ffffff; 
            color: #1a252f; 
            padding: 30px 25px; 
            border-radius: 8px; 
            text-align: center; 
            border: 2px solid #d4af37;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        h2 {
            color: #0b1a30;
            margin-top: 0;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.4rem;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #cccccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 0.95rem;
            font-family: Arial, sans-serif;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #0b1a30; 
            color: #d4af37; 
            border: 2px solid #d4af37; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem; 
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #d4af37;
            color: #0b1a30;
        }
        #statusArea { 
            color: #0b1a30; 
            font-weight: bold; 
            padding: 30px; 
            display: none; 
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .home-btn { 
            display: inline-block; 
            margin-top: 20px; 
            padding: 12px 24px; 
            background-color: #0b1a30; 
            color: #d4af37; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            border: 1px solid #d4af37;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .home-btn:hover {
            background-color: #d4af37;
            color: #0b1a30;
        }
    </style>
</head>
<body>

<div class="header">
    <!-- Replace logo.png with your emblem file name if needed -->
    <img src="logo.png" alt="International Organisation of Peace Logo">
    <h1 style="color: #d4af37; margin: 12px 0 5px 0; font-size: 1.6rem; letter-spacing: 1px; text-transform: uppercase;">
        International Organisation of Peace
    </h1>
    <a href="index.html" style="color: #d4af37; text-decoration: none; font-weight: bold; font-size: 0.95rem;">← Back to Home</a>
</div>

<div class="container" id="mainContainer">
    <h2>Membership Application</h2>
    <form id="memberForm">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" id="email" placeholder="Email Address" required>
        <select name="interest" required>
            <option value="" disabled selected>Select Area of Interest</option>
            <option value="All">All Peace Initiatives</option>
            <option value="Anti-Bullying">Anti-Bullying & Student Safety</option>
            <option value="Mental Health">Youth Mental Health Support</option>
            <option value="Community Peace">Community Peace & Dialogue</option>
        </select>
        <button type="submit">Submit Membership Application</button>
    </form>
</div>

<div id="statusArea" class="container"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfesCxoSFtitYJ-gCEF0ANu3prWcJT3uPaOxJhImNEom35-5hf3lIU9wg0AgLEIsXyWg/exec";

    document.getElementById('memberForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const emailInput = document.getElementById('email').value.trim();
        const submitBtn = e.target.querySelector('button');
        
        submitBtn.innerText = "Checking Status...";
        submitBtn.disabled = true;
        
        try {
            // 1. Fetch existing Google Sheet data
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            
            // 2. Check if email already exists in column B (index 1)
            const existingUser = data.find(row => row[1] && row[1].toLowerCase() === emailInput.toLowerCase());
            
            if (existingUser) {
                // If user exists, display their application status (Accepted/Rejected/Pending) from column D (index 3)
                showStatus("You have already applied. Your current application status is: <strong>" + (existingUser[3] || "Pending") + "</strong>");
            } else {
                // Submit new form data
                submitBtn.innerText = "Submitting...";
                await fetch(SCRIPT_URL, { method: 'POST', body: new FormData(e.target) });
                showStatus("Thank you! Your membership application has been submitted successfully. Please check back later for updates.");
            }
        } catch (error) {
            console.error("Error submitting form:", error);
            alert("An error occurred while connecting to the database. Please try again later.");
            submitBtn.innerText = "Submit Membership Application";
            submitBtn.disabled = false;
        }
    });

    function showStatus(msg) { 
        document.getElementById('mainContainer').style.display = 'none'; 
        const statusArea = document.getElementById('statusArea');
        statusArea.innerHTML = msg + '<br><br><a href="index.html" class="home-btn">Return to Headquarters</a>'; 
        statusArea.style.display = 'block'; 
    }
</script>

</body>
</html>
